<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Copyright (c) 2016 Rafael Pedicini, licensed under the MIT License
      // ----------------------------------------------------------------------
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment,
      // e.g. https://user.github.io/repo/path?query=1#fragment
      // becomes https://user.github.io/repo/?path=path&query=1#fragment
      // ----------------------------------------------------------------------
      (function() {
        var segmentCount = 1; // Only the repo name segment
        var l = window.location;
        
        // Don't redirect if already in the correct format (has ?/)
        if (l.search.includes('?/') || l.search.includes('&/')) {
          return;
        }
        
        var newPath = l.pathname.split('/').slice(1, 1 + segmentCount).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~');
        
        var newSearch = (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '');
        
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          '/' + newPath + newSearch + l.hash
        );
      })();
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
