<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#8B0000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rainbow Convention" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <title>2026 Rainbow Grand Assembly Convention</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function() {
        var segmentCount = 1;
        var l = window.location;
        
        // Don't redirect if already in the correct format (has ?/)
        if (l.search.includes('?/') || l.search.includes('&/')) {
          return;
        }
        
        var newPath = l.pathname.split('/').slice(1, 1 + segmentCount).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~');
        
        var newSearch = (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '');
        
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          '/' + newPath + newSearch + l.hash
        );
      })();
    </script>
    <style>
      /* Critical CSS for instant paint */
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html{font-size:16px}
      body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,system-ui,sans-serif;background:#fef9ef;color:#1c1c1c;line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
      #root{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
      /* Loading state */
      .app-loading{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;background:linear-gradient(180deg,#fef9ef 0%,#fdf0d0 100%)}
      .loading-content{text-align:center}
      .loading-crown{font-size:4rem;animation:bounce 1.5s ease-in-out infinite}
      .loading-text{font-family:"Playfair Display",Georgia,serif;font-size:1.5rem;color:#8B0000;margin-top:1rem}
      .loading-bar{width:200px;height:4px;background:#e8d83b;border-radius:2px;margin:2rem auto 0;overflow:hidden}
      .loading-progress{height:100%;width:0%;background:linear-gradient(90deg,#8B0000,#D4AF37);border-radius:2px;animation:load 2s ease-in-out infinite}
      @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      @keyframes load{0%{width:0%;margin-left:0}50%{width:60%;margin-left:0}100%{width:0%;margin-left:100%}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading" id="app-loading">
        <div class="loading-content">
          <div class="loading-crown">👑</div>
          <div class="loading-text">2026 Rainbow Grand Assembly Convention</div>
          <div class="loading-bar"><div class="loading-progress"></div></div>
          <p style="margin-top:1rem;color:#888;font-size:0.9rem">The Greatest Showman • August 14-16, 2026</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide loading screen when React mounts
      document.addEventListener('DOMContentLoaded', function() {
        const root = document.getElementById('root');
        const observer = new MutationObserver(function() {
          if (root.querySelector('[data-react-root]') || root.children.length > 1) {
            const loader = document.getElementById('app-loading');
            if (loader) {
              loader.style.opacity = '0';
              loader.style.transition = 'opacity 300ms ease';
              setTimeout(() => loader.remove(), 300);
            }
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true, subtree: true });
        // Fallback
        setTimeout(() => {
          const loader = document.getElementById('app-loading');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 300);
          }
        }, 3000);
      });
    </script>
  </body>
</html>
