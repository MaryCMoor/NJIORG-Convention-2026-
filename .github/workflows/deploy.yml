name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - 'test/**'
  pull_request:
    branches:
      - main

env:
  PROJECT_ID: brevdevprod
  REGION: us-central1
  SERVICE_NAME: convention-app
  REPOSITORY: convention-repo

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: projects/${{ env.PROJECT_ID }}/locations/global/workloadIdentityPools/github-actions/providers/github-provider
          service_account: github-actions-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 500.0.0'

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          # For test branches, use a different service name
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            SERVICE="${{ env.SERVICE_NAME }}"
            URL_FLAG="--no-allow-unauthenticated"
          else
            # Sanitize branch name for service name
            BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')
            SERVICE="${{ env.SERVICE_NAME }}-${BRANCH_NAME}"
            URL_FLAG="--allow-unauthenticated"
          fi

          gcloud run deploy $SERVICE \
            --image=${{ env.IMAGE_TAG }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            $URL_FLAG \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --quiet

          echo "SERVICE_URL=$(gcloud run services describe $SERVICE --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_OUTPUT

      - name: Comment PR with Preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Preview deployed: ${{ steps.deploy.outputs.SERVICE_URL }}/NJIORG-Convention-2026-/'
            })